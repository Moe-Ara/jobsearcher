{% extends "base.html" %}
{% block title %}{{ name }} · Setup · JobSearcher{% endblock %}
{% block content %}
<a class="back" href="/setup">← Setup</a>
<div class="page-head">
  <div><h1>{{ name }}</h1>
    <p class="sub">Checked before it is saved (a file the app can't read is never written); the previous version is kept in <code>config/.backups</code>.</p></div>
</div>
<form method="post" action="/setup/edit/{{ name }}" class="panel stack">
  <textarea name="text" rows="36" spellcheck="false" class="code" aria-label="{{ name }}">{{ text }}</textarea>
  <div class="btnrow"><button class="btn primary" type="submit">Save</button> <a class="btn ghost" href="/setup">Cancel</a></div>
</form>
{% endblock %}
