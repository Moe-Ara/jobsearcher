  # ---- Side jobs (track: side): part-time, mini-jobs and temporary work of any kind near home, plus remote part-time
  # IT / tutoring work. Own filters and ranking (preferences.yaml → side_jobs), never mixed into the career search.
  - company_name: Bundesagentur für Arbeit (side jobs)
    country: Germany
    sector: Side jobs
    priority: A
    careers_url: https://www.arbeitsagentur.de/jobsuche/
    ats_type: arbeitsagentur
    ats_config:
      track: side
      employer_from_posting: true
      searches:
        # 80 km straight line covers everything within an hour's drive; the real drive time then decides
        - {label: "Teilzeit & Minijob (≤ 1 h Fahrt)", umkreis: 80, arbeitszeit: "tz;mj", max_pages: 10}
        - {label: "Befristet (≤ 1 h Fahrt)", umkreis: 80, befristung: 1, max_pages: 5}
