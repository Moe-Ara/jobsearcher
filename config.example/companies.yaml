  # ---- Funded PhD / doctoral positions (ats_type: academic) ------------------------------------------
  # Doctoral positions are announced on academic boards and university portals, not on the usual job boards.
  # Each source reads its listing / search pages, follows links whose text looks like a doctoral or research
  # position, and the hard filters keep only funded positions in your field (preferences.yaml → phd).
  # academic ats_config: listing_urls (extra search pages), job_link_pattern (required), anchor_pattern,
  #   employer_from_posting (aggregators: the posting's employer becomes the company), board, max_links.
  # Verified live 2026-10-16. Not usable without a browser: DFKI (403), MPI-IS (bot challenge), Cyber Valley (500),
  # MBZUAI (403); KAUST / MBZUAI PhDs are admission programmes (apply via their portals), not postings.
