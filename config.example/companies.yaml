  # ---- Gulf job platforms (the StepStone / Indeed of the UAE and Saudi Arabia). Bayt, GulfTalent, NaukriGulf,
  # foundit (Monster Gulf), Indeed and ZeroTaxJobs block automated access (Cloudflare / Akamai; Bayt's robots.txt
  # also disallows its search pages) — their postings arrive through your e-mail alerts (bayt, gulftalent,
  # naukrigulf parsers) and through the Careerjet / Jooble aggregators below, which index them.
  # One search per role and country; a posting missing from one run is not treated as closed.
  - company_name: Workable job board (UAE, Saudi Arabia, Germany, UK)
    country: UAE
    sector: Job platform
    priority: A
    careers_url: https://jobs.workable.com
    ats_type: workable_board
    ats_config:
      employer_from_posting: true
      locations: [United Arab Emirates, Saudi Arabia, Germany, United Kingdom]
      max_pages: 3
      max_age_days: 60

