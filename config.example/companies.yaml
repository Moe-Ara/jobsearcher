# Target companies. Imported into the database on first start (when the table is empty) and via
# Companies → "Import new from companies.yaml" (adds missing ones, never overwrites UI edits).
#
# ats_type: greenhouse | lever | personio | smartrecruiters | generic | none
#   - careers_url alone is enough for supported ATS URLs (type + identifier are auto-detected).
#   - generic: reads schema.org JobPosting data from careers_url; optionally set ats_config.job_link_pattern
#     (regex) to follow links to individual job pages.
#   - none: track the company (for dedup aliases / target priority bonus) without a feed.
# ats_config options:
#   greenhouse/lever: {region: eu}       personio: {domain: jobs.personio.com, language: de}
#   smartrecruiters:  {country: de, q: "software", max_jobs: 800}
#
# Every feed below was verified live when this file was generated (2026-10-06). Priorities and sectors
# are a first guess based on your profile — adjust them.

