    country: UAE
    city: Dubai
    sector: Recruitment agency
    priority: B
    careers_url: https://www.michaelpage.ae/jobs/technology
    ats_type: generic
    ats_config:
      job_link_pattern: '/job-detail/[^?#]+/ref/jn-[0-9-]+$'
