  # ---- Internships (track: intern): the Bundesagentur's internship / trainee category near home. Internships from
  # every other source (titles with Praktikum / Intern / Trainee) join the same page — preferences.yaml → internships.
  - company_name: Bundesagentur für Arbeit (internships)
    country: Germany
    sector: Internships
    priority: A
    careers_url: https://www.arbeitsagentur.de/jobsuche/
    ats_type: arbeitsagentur
    ats_config:
      track: intern
      employer_from_posting: true
      searches:
        # 60 km straight line covers a 45-minute drive; the real drive time then decides
        - {label: "Praktikum / Trainee (≤ 45 min Fahrt)", umkreis: 60, angebotsart: 34, veroeffentlichtseit: 60, max_pages: 5}
        - {label: "Remote-Praktikum IT", was: "Praktikum remote Software", angebotsart: 34, veroeffentlichtseit: 60, require_remote: true, max_pages: 1}

  # ---- Germany & UK job platforms with official APIs / feeds. StepStone, Indeed, LinkedIn, Xing, Monster, Glassdoor,
  # Totaljobs, CWJobs, CV-Library … don't allow automated searches: their job-alert e-mails are read instead.
  - company_name: Bundesagentur für Arbeit (Jobsuche, Germany-wide)
    country: Germany
    sector: Job platform
    priority: A
    careers_url: https://www.arbeitsagentur.de/jobsuche/
    ats_type: arbeitsagentur
    ats_config:
      employer_from_posting: true
      queries_from_preferences: true   # one nationwide search per term in preferences.yaml → search.queries
      search_defaults: {veroeffentlichtseit: 7, zeitarbeit: "false", max_pages: 1}

  - company_name: Arbeitnow (Germany)
    country: Germany
    sector: Job platform
    priority: A
    careers_url: https://www.arbeitnow.com
    ats_type: arbeitnow
    ats_config:
      employer_from_posting: true
      max_pages: 3

  - company_name: Berlin Startup Jobs (engineering)
    country: Germany
    city: Berlin
    sector: Job platform
    priority: B
    careers_url: https://berlinstartupjobs.com/engineering/feed/
    ats_type: rss
    ats_config:
      employer_from_posting: true
      title_separator: " // "
      fetch_page: true
      source_name: berlinstartupjobs

  - company_name: jobs.ac.uk (UK academic & PhD)
    country: United Kingdom
    sector: Research / Academia
    priority: B
    careers_url: https://www.jobs.ac.uk/search/?keywords=phd+machine+learning
    ats_type: academic
    ats_config:
      board: true
      employer_from_posting: true
      job_link_pattern: 'jobs\.ac\.uk/job/[A-Z0-9]+/[a-z0-9-]+$'
      anchor_pattern: '.'
      max_links: 60
      listing_urls:
        - https://www.jobs.ac.uk/search/?keywords=phd+artificial+intelligence
        - https://www.jobs.ac.uk/search/?keywords=phd+computer+science
        - https://www.jobs.ac.uk/search/?keywords=phd+robotics
        - https://www.jobs.ac.uk/search/?keywords=research+associate+machine+learning
        - https://www.jobs.ac.uk/search/?keywords=research+software+engineer

